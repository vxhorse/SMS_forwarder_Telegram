services:
  sms-forwarder:
    image: vxhorse/sms-forwarder:latest
    container_name: sms-forwarder
    restart: unless-stopped
    network_mode: "host"
    stop_signal: SIGTERM
    stop_grace_period: 30s
    volumes:
      # A bind mount rather than devices: - the latter is resolved when the
      # container is created, so a device that has not finished enumerating
      # yet makes creation fail outright, and a restart policy never applies
      # to a container that never ran. Mounted at /hostdev instead of over
      # /dev so the container keeps its own pts, shm and null.
      - /dev:/hostdev
      - /etc/localtime:/etc/localtime:ro
    device_cgroup_rules:
      - 'c 188:* rmw'      # USB serial adapters (ttyUSB*)
      - 'c 166:* rmw'      # CDC-ACM devices (ttyACM*)
    env_file:
      # Copy .env.example to .env first; without it the container starts with
      # no credentials configured.
      - .env
    environment:
      # Overrides whatever .env says, because it describes this compose file's
      # own layout rather than the operator's preference.
      - SMS_DEV_ROOT=/hostdev
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Must exceed SERVICE_STABLE_SECONDS plus the time the modem needs to
      # enumerate. A component is only reported up after its session has held
      # for SERVICE_STABLE_SECONDS, and the health file is not written until
      # every component is up, so the first write lands at connect + 60s.
      start_period: 180s
