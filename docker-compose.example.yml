services:
  sms-forwarder:
    # A dated tag rather than latest is worth the edit on a machine you rely on:
    # an upgrade becomes an explicit act, and a rollback is this one line. The
    # tags published alongside latest are named for the date they were built.
    image: vxhorse/sms-forwarder:latest
    container_name: sms-forwarder
    restart: unless-stopped
    network_mode: "host"
    stop_signal: SIGTERM
    # The shutdown path inside the process is bounded at ten seconds:
    # NOTIFY_TIMEOUT and SERIAL_CLOSE_TIMEOUT are awaited one after the other on
    # the way out, and config.py clamps the two to share that one budget. Thirty
    # seconds here is generous against it. Cutting it below ten is not: a
    # teardown the grace period ends early is a kill rather than a clean stop,
    # and the port is then released by the kernel rather than by the process.
    stop_grace_period: 30s
    volumes:
      # A bind mount rather than devices:, so that container creation does not
      # depend on the modem already being there. Mounted at /hostdev instead of
      # over /dev so the container keeps its own pts, shm and null.
      # See "Why not devices:" in README.md.
      - /dev:/hostdev
      - /etc/localtime:/etc/localtime:ro
    device_cgroup_rules:
      - 'c 188:* rmw'      # USB serial adapters (ttyUSB*)
      - 'c 166:* rmw'      # CDC-ACM devices (ttyACM*)
    env_file:
      # Copy .env.example to .env first. Without that file Compose refuses to
      # parse this one and starts nothing at all, which is the better failure:
      # a container that came up with no credentials would look like a working
      # deployment and forward nothing.
      - .env
    environment:
      # Overrides whatever .env says, because it describes this compose file's
      # own layout rather than the operator's preference.
      - SMS_DEV_ROOT=/hostdev
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Must exceed SERVICE_STABLE_SECONDS plus the time the modem needs to
      # enumerate; raise it if yours is slower. See "Reading the health check"
      # in README.md.
      start_period: 180s
