[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Every test here terminates on a condition the test controls, so any test that
# reaches this has stopped doing that. The number is two orders of magnitude
# above the slowest test in the suite; it is not a budget to tune, it is the
# line past which a test is hung rather than slow.
#
# What it buys is a name. Without it a hung test takes the CI job's whole
# timeout and the run is reported as "cancelled" - which reads as though a
# person cancelled it, so a suite that had stopped passing on one interpreter
# went unnoticed across several runs. With it the same hang is one FAILED line
# naming the test, and the traceback says where it stopped.
timeout = 60
# signal, not thread: the thread method dumps and kills the interpreter, so the
# first hung test is the last thing the run reports. SIGALRM interrupts the one
# test, which is then reported as a failure like any other and the rest of the
# suite still runs - so one hang does not hide whatever else is broken.
timeout_method = signal
filterwarnings =
    ignore::SyntaxWarning:gsmmodem.*
    ignore::SyntaxWarning:.*serial_comms.*
