name: CI

on:
  push:
    branches: [master]
    # Publishing is a tag push and nothing else, so the git tag and the image
    # tag are the same string and every published image maps back to a commit.
    tags: ['*']
  pull_request:
  workflow_dispatch:

# The repository default is read, but a workflow that can publish an image
# should state what it may do rather than inherit it: that default is one click
# from read-write in the repository settings, and nothing here would notice the
# day it changed.
permissions:
  contents: read

env:
  IMAGE: vxhorse/sms-forwarder

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite exercises supervision loops, backoff and a watchdog. A
    # regression in any of them shows up as a test that never returns, and
    # without a timeout that would burn the six-hour default budget instead of
    # failing. Ten minutes is far above the suite's normal runtime.
    timeout-minutes: 10
    strategy:
      matrix:
        # The interpreter the image ships, and the newest supported one. The
        # first is the one that matters: a suite that only ever runs on a
        # developer's newer venv says nothing about what production executes.
        # tests/test_runtime.py fails if this list stops covering the
        # Dockerfile's base image. 3.11 is deliberately absent - see the
        # cancellation guard in that file for what it does not do correctly.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  image:
    # Nothing is published unless the suite passed on both interpreters. A
    # published tag cannot be withdrawn — deleting it unlinks the name and
    # leaves the layers fetchable by digest — so the gate belongs before the
    # push rather than after it.
    needs: test
    runs-on: ubuntu-latest
    # The arm64 half is emulated on an amd64 runner and is several times slower
    # than the native half.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Every docker/* action in this job - the two setup steps and the login
      # immediately below, and the build-push further down - is pinned by
      # commit rather than by moving tag, because on a tag push they are the
      # code that handles the registry credential. Count them if you add one:
      # a pin that is skipped is invisible until it is the one that matters.

      # This is what a developer machine is missing when a multi-platform build
      # dies at the first RUN with "exec format error": the emulator for the
      # architecture the builder is not. A machine without it still builds a
      # multi-platform image successfully whenever every foreign layer happens
      # to be a cache hit, so the capability can be absent for months without
      # anything saying so.
      - name: Register the emulator for the non-native architecture
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        if: github.ref_type == 'tag'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Decide what this run produces
        id: plan
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            {
              echo "push=true"
              echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:latest"
              echo "outputs="
            } >> "$GITHUB_OUTPUT"
          else
            # Not a publish. The image is still built for every platform and
            # written to an OCI archive, so the check below reads a real index
            # on every run rather than lying dormant until the day it would
            # have mattered.
            {
              echo "push=false"
              echo "tags=${IMAGE}:ci"
              echo "outputs=type=oci,dest=image.tar"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build every platform
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.plan.outputs.push }}
          tags: ${{ steps.plan.outputs.tags }}
          outputs: ${{ steps.plan.outputs.outputs }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Every platform the READMEs promise is in the index
        shell: bash
        run: |
          set -euo pipefail
          # The wanted list is written out here rather than read from the
          # platforms input above, and that is the entire point of this step.
          # Dropping an architecture from that input fails nothing — it builds
          # a smaller index and publishes it, which is exactly how latest
          # became arm64-only once already. A check that read the same variable
          # would agree with itself and catch nothing.
          #
          # Kept as a sorted file compared with comm rather than a list walked
          # by the shell, so the comparison does not depend on word splitting.
          printf '%s\n' linux/amd64 linux/arm64 > want.txt

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" --raw > index.json
          else
            # An OCI archive nests one level: index.json names the image index,
            # whose blob carries the per-platform manifests.
            mkdir -p oci && tar -xf image.tar -C oci
            digest=$(jq -r '.manifests[0].digest' oci/index.json | tr ':' '/')
            cp "oci/blobs/${digest}" index.json
          fi

          # Provenance and SBOM attestations ride along as unknown/unknown.
          # They are not platforms and must not be counted as one.
          jq -r '.manifests[]
                 | select(.platform.os != "unknown")
                 | "\(.platform.os)/\(.platform.architecture)"' index.json \
            | sort -u > got.txt
          echo "platforms in the index:"; sed 's/^/  /' got.txt

          missing=$(comm -23 want.txt got.txt)
          if [ -n "${missing}" ]; then
            echo "::error::the image index is missing: $(echo ${missing} | tr '\n' ' ')"
            exit 1
          fi

      # Deliberately after the platform check, not before it: this step is what
      # the registry page tells people the image is, and it should not describe
      # something the run has not confirmed it shipped.
      #
      # Runs on a manual dispatch as well as a tag, so the description can be
      # corrected without cutting a release, and so this step can be exercised
      # at all - it needs no docker login, only the API credential, which is
      # why it works on a branch run where the registry login is skipped.
      - name: Give the registry page the same description as the repository
        if: >-
          github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::the Docker Hub credentials are not set"
            exit 1
          fi

          # README.md is the source. Docker Hub renders the markdown but
          # resolves relative links against its own host, so every link to
          # another file in this repository has to become absolute or it points
          # at a Docker Hub page that does not exist. Anchors are left alone -
          # they resolve within the rendered page.
          python3 - "$GITHUB_REPOSITORY" "$GITHUB_SHA" > overview.md <<'PY'
          import re, sys
          repo, sha = sys.argv[1], sys.argv[2]
          base = f"https://github.com/{repo}/blob/{sha}/"
          text = open("README.md", encoding="utf-8").read()
          # ](path) where path is not absolute, not an anchor, not a protocol
          text = re.sub(
              r"\]\((?!https?://|#|/)([^)]+)\)",
              lambda m: f"]({base}{m.group(1)})",
              text,
          )
          sys.stdout.write(text)
          PY
          echo "overview: $(wc -c < overview.md) bytes"

          # Docker Hub caps the short description at 100 characters, so it
          # cannot be README.md's opening paragraph, which is half as long
          # again. It is the one sentence that exists twice; everything else on
          # that page is generated from the file above.
          SHORT='Forwards SMS from a serial GSM/LTE modem to Telegram, and sends SMS back out from Telegram.'

          # The credential goes in on stdin, never on a command line, so it
          # cannot surface in a process listing on the runner.
          TOKEN=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" \
                    '{username:$u,password:$p}' \
                  | curl -sS --fail-with-body -X POST \
                      -H 'Content-Type: application/json' --data @- \
                      https://hub.docker.com/v2/users/login/ \
                  | jq -r .token)
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "::error::could not obtain a Docker Hub API token"
            exit 1
          fi

          code=$(jq -n --arg s "$SHORT" --rawfile f overview.md \
                   '{description:$s, full_description:$f}' \
                 | curl -sS -o response.json -w '%{http_code}' -X PATCH \
                     -H "Authorization: JWT ${TOKEN}" \
                     -H 'Content-Type: application/json' --data @- \
                     "https://hub.docker.com/v2/repositories/${IMAGE}/")
          if [ "${code}" != "200" ]; then
            echo "::error::Docker Hub rejected the description update (HTTP ${code})"
            # The body names the failing field; it carries no credential.
            head -c 500 response.json
            exit 1
          fi
          echo "registry page updated (HTTP ${code})"
